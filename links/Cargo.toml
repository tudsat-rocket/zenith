[package]
name = "links"
version = "0.1.0"
edition = "2024"

[features]
hybrid = []

[dependencies]
rapid-dialect = { workspace = true }
mavio = { version = "0.5.10", features = ["dlct-common"] }
heapless = { workspace = true }

embassy-time = { workspace = true }
embassy-futures = { workspace = true }
embassy-sync = { workspace = true }

log = { workspace = true }

# Only for the MCU reset behind PREFLIGHT_REBOOT_SHUTDOWN; the host/SITL build has no use for it.
[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7"

[lints]
workspace = true
